<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student Profile | EduSphere ERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/palette.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="student-edit-profile-page theme-{{ current_user.theme or 'light' }} accent-{{ current_user.accent_color or 'purple' }}">
<div class="sidebar">
    <div class="logo"><h2>EduSphere <span>ERP</span></h2><small>Student Portal</small></div>
    <ul>
        <li onclick="window.location.href='{{ url_for('student') }}'"><i class="fa-solid fa-house"></i><span>Dashboard</span></li>
        <li onclick="window.location.href='{{ url_for('student_library') }}'"><i class="fa-solid fa-book-open"></i><span>My Courses</span></li>
        <li onclick="window.location.href='{{ url_for('student_attendance') }}'"><i class="fa-solid fa-user-check"></i><span>Attendance</span></li>
        <li onclick="window.location.href='{{ url_for('student_results') }}'"><i class="fa-solid fa-chart-simple"></i><span>Results</span></li>
        <li onclick="window.location.href='{{ url_for('student_assignments') }}'"><i class="fa-solid fa-file-lines"></i><span>Assignments</span></li>
        <li onclick="window.location.href='{{ url_for('student_timetable') }}'"><i class="fa-solid fa-calendar-days"></i><span>Timetable</span></li>
        <li onclick="window.location.href='{{ url_for('student_materials') }}'"><i class="fa-solid fa-book"></i><span>Study Materials</span></li>
        <li onclick="window.location.href='{{ url_for('student_notices') }}'"><i class="fa-solid fa-bell"></i><span>Notices</span></li>
        <li onclick="window.location.href='{{ url_for('student_settings') }}'"><i class="fa-solid fa-gear"></i><span>Settings</span></li>
        <li class="sidebar-profile active" onclick="window.location.href='{{ url_for('student_profile') }}'">
            <i class="fa-solid fa-circle-user"></i>
            <div class="sidebar-profile-details">
                <strong>{{ current_user.full_name }}</strong>
                <small>{{ current_user.enrollment_no or 'Enrollment unavailable' }}</small>
            </div>
        </li>
        <li onclick="window.location.href='{{ url_for('logout') }}'">
            <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
        </li>
    </ul>
</div>

<main class="main">
    <div class="topbar"><h2>Edit Profile</h2></div>
    <section class="profile-card">
        <form class="profile-form" method="POST" action="{{ url_for('edit_student_profile') }}">
            <div><label for="full_name">Full Name</label><input id="full_name" name="full_name" value="{{ current_user.full_name }}" required></div>
            <div><label for="email">Email</label><input id="email" type="email" name="email" value="{{ current_user.email or '' }}" required></div>
            <div><label for="phone">Phone Number</label><input id="phone" type="tel" name="phone" value="{{ student_profile.phone or '' }}"></div>
            <div><label for="enrollment_no">Enrollment Number</label><input id="enrollment_no" value="{{ current_user.enrollment_no or '' }}" readonly></div>
            <div><label for="department">Department</label><select id="department" name="department" required><option value="">Select Department</option>{% for department in departments %}<option value="{{ department.name }}" {% if department.name == student_profile.department %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></div>
            <div><label for="parent_email">Parent Email</label><input id="parent_email" type="email" value="{{ student_profile.parent_email or '' }}" readonly></div>
            <div><label for="semester">Semester</label><input id="semester" type="number" min="1" name="semester" value="{{ student_profile.semester or '' }}"></div>
            <div><label for="division">Division</label><input id="division" name="division" value="{{ student_profile.division or '' }}"></div>
            <div class="profile-actions full-width">
                <a class="secondary-button" href="{{ url_for('student_profile') }}">Cancel</a>
                <button type="submit">Save Changes</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
