<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Weekly Schedule | Educon</title><link rel="stylesheet" href="{{ url_for('static', filename='css/teacher.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/palette.css') }}"></head><body class="teacher-dashboard-page teacher-manage-materials theme-{{ current_user.theme or 'light' }} accent-{{ current_user.accent_color or 'purple' }}"><main class="main"><div class="topbar"><h2>Manage Weekly Schedule</h2></div>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="material-alert">{{ message }}</div>{% endfor %}{% endwith %}<section class="box"><h3>Add Lecture</h3><form class="material-form" method="POST"><input type="hidden" name="action" value="add"><label>Day<select name="day_of_week" required>{% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<option value="{{ loop.index0 }}">{{ day }}</option>{% endfor %}</select></label><label>Subject<input name="subject" required></label><label>Department<input name="department" value="{{ current_user.department or '' }}" placeholder="Department" required></label><label>Start time<input type="time" name="start_time" required></label><label>End time<input type="time" name="end_time" required></label><label>Room (optional)<input name="room"></label><button type="submit">Add Lecture</button></form></section><section class="box"><h3>My Weekly Schedule</h3>{% for lecture in lectures %}<form class="teacher-lecture-form" method="POST"><input type="hidden" name="action" value="update"><input type="hidden" name="lecture_id" value="{{ lecture.id }}"><select name="day_of_week" required>{% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<option value="{{ loop.index0 }}" {% if lecture.day_of_week == loop.index0 %}selected{% endif %}>{{ day }}</option>{% endfor %}</select><input name="subject" value="{{ lecture.subject }}" required><input name="department" value="{{ lecture.department or '' }}" required><input type="time" name="start_time" value="{{ lecture.start_time }}" required><input type="time" name="end_time" value="{{ lecture.end_time }}" required><input name="room" value="{{ lecture.room or '' }}" placeholder="Room"><button type="submit">Save</button><button type="submit" name="action" value="delete" formnovalidate>Delete</button></form>{% else %}<p>No lectures scheduled yet.</p>{% endfor %}</section></main></body></html>
