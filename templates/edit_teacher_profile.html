<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teacher Profile | EduSphere ERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teacher.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/palette.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="sidebar"><div class="logo"><h2>EduSphere</h2></div><ul>
    <li onclick="window.location.href='{{ url_for('teacher') }}'"><i class="fa-solid fa-house"></i><span>Dashboard</span></li>
    <li class="active" onclick="window.location.href='{{ url_for('teacher_profile') }}'"><i class="fa-solid fa-circle-user"></i><span>Profile</span></li>
    <li onclick="window.location.href='{{ url_for('teacher_students') }}'"><i class="fa-solid fa-users"></i><span>Students</span></li>
    <li onclick="window.location.href='{{ url_for('teacher_attendance') }}'"><i class="fa-solid fa-user-check"></i><span>Attendance</span></li>
    <li onclick="window.location.href='{{ url_for('teacher_materials') }}'"><i class="fa-solid fa-book"></i><span>Study Material</span></li>
    <li onclick="window.location.href='{{ url_for('teacher_assignments') }}'"><i class="fa-solid fa-file-lines"></i><span>Assignments</span></li>
    <li onclick="window.location.href='{{ url_for('manage_materials') }}'"><i class="fa-solid fa-folder-plus"></i><span>Manage Materials</span></li>
    <li onclick="window.location.href='{{ url_for('logout') }}'"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></li>
</ul></div>
<main class="main">
    <div class="topbar"><h2>Edit Profile</h2></div>
    <section class="profile-card"><form class="profile-form" method="POST" action="{{ url_for('edit_teacher_profile') }}">
        <div><label for="full_name">Full Name</label><input id="full_name" name="full_name" value="{{ current_user.full_name }}" required></div>
        <div><label for="email">Email</label><input id="email" type="email" name="email" value="{{ current_user.email or '' }}" required></div>
        <div><label for="phone">Phone Number</label><input id="phone" type="tel" name="phone" value="{{ current_user.phone or '' }}"></div>
        <div><label for="employee_id">Employee ID</label><input id="employee_id" value="{{ current_user.employee_id or '' }}" readonly></div>
        <div><label for="department">Department</label><select id="department" name="department" required><option value="">Select Department</option>{% for department in departments %}<option value="{{ department.name }}" {% if department.name == teacher_profile.department %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></div>
        <div><label for="subject">Subject</label><input id="subject" name="subject" value="{{ teacher_profile.subject or '' }}"></div>
        <div class="profile-actions full-width"><a class="secondary-button" href="{{ url_for('teacher_profile') }}">Cancel</a><button type="submit">Save Changes</button></div>
    </form></section>
</main>
</body>
</html>
