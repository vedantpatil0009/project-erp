<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | EduSphere ERP</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css')}}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <div class="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="container">

    <div class="register-box">

        <h1>Create Account</h1>

        <p>Join EduSphere ERP</p>

        <form action="/register" method="POST">

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input type="text" name="full_name" placeholder="Full Name" required>
            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input type="email" name="email" placeholder="Email Address" required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input type="tel" name="phone" placeholder="Phone Number" required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-users"></i>

                <select name="role" id="registrationRole" required>

                    <option value="">Select Role</option>

                    <option>Student</option>

                    <option>Teacher</option>

                    <option>Parent</option>

                </select>

            </div>

            <div class="input-box role-id-field" data-role="Student" hidden>

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    name="enrollment_no"
                    placeholder="Student Enrollment Number"
                    disabled>

            </div>

            <div class="input-box role-id-field" data-role="Teacher" hidden>

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    name="employee_id"
                    placeholder="Employee ID"
                    disabled>

            </div>

            <div class="input-box role-id-field" data-role="Parent" hidden>

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    name="parent_id"
                    placeholder="Parent ID"
                    disabled>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-school"></i>

                <input type="text" name="department" placeholder="Department / Class" required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password" name="password" placeholder="Password" required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password" placeholder="Confirm Password" required>

            </div>

            <button type="submit">

                Register

            </button>

        </form>

        <div class="login-link">

            <p>

                Already have an account?

                <a href="/login">Login</a>

            </p>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/register.js')}}"></script>

</body>

</html>
