<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings | EduSphere ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/palette.css') }}"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"></head>
<body class="common-settings-page theme-{{ current_user.theme or 'light' }} accent-{{ current_user.accent_color or 'purple' }}"><div class="sidebar"><div class="logo"><h2>EduSphere <span>ERP</span></h2><small>{{ role }} Portal</small></div><ul><li onclick="window.location.href='{{ url_for(dashboard_endpoint) }}'"><i class="fa-solid fa-house"></i><span>Dashboard</span></li><li class="active"><i class="fa-solid fa-gear"></i><span>Settings</span></li><li onclick="window.location.href='{{ url_for('logout') }}'"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></li></ul></div>
<main class="main"><div class="topbar"><div><h1>Settings</h1><p>Manage your preferences and account security.</p></div></div>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}
<section class="box settings-card"><h3>Preferences</h3><form method="POST"><input type="hidden" name="action" value="preferences"><label>Theme<select name="theme"><option value="light" {% if current_user.theme == 'light' %}selected{% endif %}>Light</option><option value="dark" {% if current_user.theme == 'dark' %}selected{% endif %}>Dark</option></select></label><label class="settings-toggle"><input type="checkbox" name="notifications_enabled" {% if current_user.notifications_enabled %}checked{% endif %}> Enable notifications</label><label>Accent Color<select name="accent_color"><option value="purple" {% if current_user.accent_color == 'purple' %}selected{% endif %}>Purple</option><option value="blue" {% if current_user.accent_color == 'blue' %}selected{% endif %}>Blue</option><option value="green" {% if current_user.accent_color == 'green' %}selected{% endif %}>Green</option></select></label><button type="submit">Save Preferences</button></form></section>
<section class="box settings-card"><h3>Change Password</h3><form method="POST"><input type="hidden" name="action" value="password"><label>Current Password<input type="password" name="current_password" required></label><label>New Password<input type="password" name="new_password" required></label><label>Confirm New Password<input type="password" name="confirm_password" required></label><button type="submit">Change Password</button></form></section></main></body></html>
